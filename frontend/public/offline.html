<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0c6e50" />
    <title>当前离线 · Lift Log</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; color: #0f172a; background: #f5f7f9; }
      main { width: min(100%, 480px); border: 1px solid #d8dee6; border-radius: 16px; padding: 32px; text-align: center; background: white; box-shadow: 0 12px 36px rgb(15 23 42 / 8%); }
      .icon { width: 56px; height: 56px; margin: 0 auto; display: grid; place-items: center; border-radius: 999px; color: #92400e; background: #fef3c7; }
      .icon svg { width: 28px; height: 28px; }
      h1 { margin: 20px 0 0; font-size: 24px; }
      p { margin: 12px 0 0; color: #596579; font-size: 14px; line-height: 1.7; }
      a { min-height: 44px; margin-top: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0 18px; color: white; background: #0c6e50; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 0 1-6.7-9" />
          <path d="M5.4 5.4A9 9 0 0 1 20 12.2" />
          <path d="m3 3 18 18" />
        </svg>
      </div>
      <h1>当前处于离线状态</h1>
      <p>已经访问并同步过的训练页仍可使用。离线添加的训练组会保存在本机，恢复网络后自动同步。</p>
      <a href="/workouts">打开训练记录</a>
    </main>
  </body>
</html>
